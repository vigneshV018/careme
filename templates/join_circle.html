{% extends "base.html" %}

{% block title %}Join Care Circle - CareMe{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8 text-center">
    <div class="w-16 h-16 rounded-3xl bg-teal-100 text-teal-700 flex items-center justify-center text-3xl mx-auto mb-4">
        <i class="fa-solid fa-people-roof"></i>
    </div>
    <h1 class="text-2xl font-black text-slate-900">Join a Care Circle</h1>
    <p class="text-xs text-slate-500 mt-1 mb-6">Enter the 6-digit passcode provided by your elder or family admin</p>

    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
        <form method="POST" action="/circle/join" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Circle Passcode</label>
                <input type="text" name="passcode" required maxlength="6" value="482915" placeholder="e.g. 482915"
                    class="w-full text-center text-2xl font-black tracking-widest px-4 py-3 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <p class="text-[11px] text-brand-600 font-bold mt-1">Default demo passcode: 482915 (Lakshmi's Circle)</p>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Your Relationship</label>
                <input type="text" name="relationship" value="Family Member" placeholder="e.g. Son, Daughter, Caregiver"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>

            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow transition text-sm">
                Connect to Care Circle
            </button>
        </form>
    </div>
</div>
{% endblock %}
